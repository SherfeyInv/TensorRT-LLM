<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="815" aria-labelledby="title desc" role="img" viewBox="0 0 1800 815"><title id="title">AA-AgentPerf closed-loop request workflow</title><desc id="desc">A simulated agent sends the next recorded turn with its accumulated conversation. The inference deployment routes the request using conversation or cache affinity, reuses matching KV blocks, prefills only the uncached suffix, optionally retrieves the KV cache on the generation side in disaggregated serving, and streams the generated response. The client drains the complete response, simulates tool time when needed, advances the trajectory, and sends the next turn.</desc><defs><style>.lane-title{font:700 17px &quot;NVIDIA Sans&quot;,Arial,sans-serif;letter-spacing:1.2px}.box-title{font:700 20px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#111827}.box-text{font:400 16px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#475569}.step{font:700 16px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#fff}.path-label{font:600 16px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#1e40af}.callout-title{font:700 18px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#365314}.callout-text,.legend{font:400 16px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#4d7c0f}.legend{fill:#475569}</style><filter id="shadow" width="120%" height="125%" x="-10%" y="-10%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".1" stdDeviation="3"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#475569" d="M 0 0 L 12 6 L 0 12 z"/></marker><marker id="arrowBlue" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2563eb" d="M 0 0 L 12 6 L 0 12 z"/></marker><marker id="arrowGreen" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#65a30d" d="M 0 0 L 12 6 L 0 12 z"/></marker></defs><rect width="1800" height="815" fill="#fff"/><g transform="translate(0,-85)"><rect width="1720" height="225" x="40" y="110" fill="#f7fee7" stroke="#bef264" stroke-width="1.5" rx="18"/><rect width="310" height="34" x="68" y="128" fill="#d9f99d" rx="17"/><text x="223" y="151" fill="#365314" class="lane-title" text-anchor="middle">CLIENT / AGENT HARNESS</text><rect width="1720" height="425" x="40" y="370" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="18"/><rect width="310" height="34" x="68" y="388" fill="#dbeafe" rx="17"/><text x="223" y="411" fill="#1e3a8a" class="lane-title" text-anchor="middle">INFERENCE DEPLOYMENT</text><rect width="300" height="105" x="100" y="185" fill="#ecfccb" stroke="#76b900" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="128" cy="213" r="18" fill="#4d7c0f"/><text x="128" y="219" class="step" text-anchor="middle">1</text><text x="158" y="218" class="box-title">Send recorded turn</text><text x="125" y="250" class="box-text">Accumulated conversation</text><text x="125" y="274" class="box-text">and the next request</text><rect width="300" height="105" x="500" y="185" fill="#ecfccb" stroke="#76b900" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="528" cy="213" r="18" fill="#4d7c0f"/><text x="528" y="219" class="step" text-anchor="middle">8</text><text x="558" y="218" class="box-title">Advance trajectory</text><text x="525" y="250" class="box-text">Next recorded turn or</text><text x="525" y="274" class="box-text">next assigned trajectory</text><rect width="300" height="105" x="900" y="185" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="928" cy="213" r="18" fill="#ea580c"/><text x="928" y="219" class="step" text-anchor="middle">7</text><text x="958" y="218" class="box-title">Simulate tool time</text><text x="925" y="250" class="box-text">Only for turns with a tool call</text><text x="925" y="274" class="box-text">Client-side delay · no LLM compute</text><rect width="400" height="105" x="1300" y="185" fill="#ecfccb" stroke="#76b900" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="1328" cy="213" r="18" fill="#4d7c0f"/><text x="1328" y="219" class="step" text-anchor="middle">6</text><text x="1358" y="218" class="box-title">Receive complete response</text><text x="1325" y="250" class="box-text">Drain the stream and assemble chunks</text><text x="1325" y="274" class="box-text">Record TTFT and output speed</text><path fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" d="M 1300 237 L 1214 237"/><path fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" d="M 900 237 L 814 237"/><path fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" d="M 500 237 L 414 237"/><rect width="330" height="160" x="120" y="500" fill="#fff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="150" cy="530" r="19" fill="#0369a1"/><text x="150" y="536" class="step" text-anchor="middle">2</text><text x="183" y="536" class="box-title">Route + prefix lookup</text><text x="150" y="573" class="box-text">Conversation-aware or cache-aware</text><text x="150" y="598" class="box-text">worker and rank selection</text><text x="150" y="628" class="box-text">Reuse matching resident KV blocks</text><rect width="330" height="160" x="520" y="500" fill="#fff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="550" cy="530" r="19" fill="#0369a1"/><text x="550" y="536" class="step" text-anchor="middle">3</text><text x="583" y="536" class="box-title">Prefill uncached suffix</text><text x="550" y="573" class="box-text">Reuse removes the cached prefix</text><text x="550" y="598" class="box-text">from new prefill computation</text><text x="550" y="628" class="box-text">Context side produces the first token</text><rect width="330" height="160" x="950" y="500" fill="#f8fafc" stroke="#38bdf8" stroke-dasharray="9 7" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="980" cy="530" r="19" fill="#0284c7"/><text x="980" y="536" class="step" text-anchor="middle">4</text><text x="1013" y="536" class="box-title">Retrieve KV cache</text><text x="980" y="573" class="box-text">Returned context metadata locates</text><text x="980" y="598" class="box-text">the KV cache for the generation side</text><text x="980" y="628" class="box-text">Disaggregated serving only</text><rect width="330" height="160" x="1350" y="500" fill="#fff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" rx="14"/><circle cx="1380" cy="530" r="19" fill="#0369a1"/><text x="1380" y="536" class="step" text-anchor="middle">5</text><text x="1413" y="536" class="box-title">Generate + stream</text><text x="1380" y="573" class="box-text">Continue decoding the response</text><text x="1380" y="598" class="box-text">on the same worker or a</text><text x="1380" y="623" class="box-text">separate generation worker</text><path fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" d="M 250 290 C 250 360, 285 420, 285 486"/><path fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" d="M 450 580 L 506 580"/><path fill="none" stroke="#2563eb" stroke-dasharray="9 7" stroke-width="3" marker-end="url(#arrowBlue)" d="M 850 580 L 936 580"/><path fill="none" stroke="#2563eb" stroke-dasharray="9 7" stroke-width="3" marker-end="url(#arrowBlue)" d="M 1280 580 L 1336 580"/><text x="1100" y="476" class="path-label" text-anchor="middle">Disaggregated path</text><path fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)" d="M 850 520 C 980 438, 1220 438, 1350 520"/><text x="1100" y="449" class="path-label" text-anchor="middle">Aggregated serving · same worker</text><path fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" d="M 1515 500 C 1515 420, 1500 356, 1500 304"/><rect width="730" height="68" x="120" y="690" fill="#f7fee7" stroke="#a3e635" stroke-width="1.5" rx="12"/><text x="145" y="719" class="callout-title">Conversation affinity helps preserve reuse across turns</text><text x="145" y="744" class="callout-text">Later turns prefer the worker and rank that hold the accumulated conversation prefix.</text><path fill="none" stroke="#65a30d" stroke-dasharray="7 6" stroke-width="2.5" marker-end="url(#arrowGreen)" d="M 285 660 L 285 680"/><rect width="18" height="18" x="440" y="846" fill="#fff" stroke="#0284c7" stroke-width="2" rx="3"/><text x="470" y="861" class="legend">Inference work</text><rect width="18" height="18" x="680" y="846" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="3"/><text x="710" y="861" class="legend">Client-simulated tool time</text><line x1="1010" x2="1060" y1="855" y2="855" stroke="#65a30d" stroke-dasharray="7 6" stroke-width="2.5" marker-end="url(#arrowGreen)"/><text x="1075" y="861" class="legend">Conversation affinity and prefix reuse</text></g></svg>