<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="750" aria-labelledby="title desc" role="img" viewBox="0 100 1800 750"><title id="title">Two-level routing for context locality in disaggregated serving</title><desc id="desc">An agentic request enters the TensorRT LLM disaggregated front-end. Instance-level routing first selects a context server, then the selected server&apos;s attention data-parallel router performs rank-level routing. Each level can use conversation-aware affinity or KV-cache-aware scoring. Full conversation-prefix reuse requires a later turn to return to both the context server and the rank that hold the corresponding KV blocks. The selected context rank transfers KV cache to a generation server, which decodes and streams the response.</desc><defs><style>.eyebrow{font:700 15px &quot;NVIDIA Sans&quot;,Arial,sans-serif;letter-spacing:1.2px}.card-title{fill:#111827}.server-title{font:700 25px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#111827}.card-title{font:700 19px &quot;NVIDIA Sans&quot;,Arial,sans-serif}.body,.small{font:400 16px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#475569}.small{font:400 14px &quot;NVIDIA Sans&quot;,Arial,sans-serif}.pill{font:700 14px &quot;NVIDIA Sans&quot;,Arial,sans-serif;letter-spacing:.4px}.flow-label{font:600 15px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#334155}.miss-label{font:700 14px &quot;NVIDIA Sans&quot;,Arial,sans-serif;fill:#be123c}</style><filter id="shadow" width="120%" height="125%" x="-10%" y="-10%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".1" stdDeviation="3"/></filter><marker id="arrowGray" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12.5" refY="7"><path fill="#64748b" d="M 0 0 L 14 7 L 0 14 z"/></marker><marker id="arrowGreen" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12.5" refY="7"><path fill="#65a30d" d="M 0 0 L 14 7 L 0 14 z"/></marker><marker id="arrowBlue" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12.5" refY="7"><path fill="#2563eb" d="M 0 0 L 14 7 L 0 14 z"/></marker><marker id="arrowRed" markerHeight="14" markerUnits="userSpaceOnUse" markerWidth="14" orient="auto" refX="12.5" refY="7"><path fill="#e11d48" d="M 0 0 L 14 7 L 0 14 z"/></marker></defs><rect width="1800" height="940" fill="#fff"/><rect width="250" height="250" x="50" y="260" fill="#f7fee7" stroke="#76b900" stroke-width="2" filter="url(#shadow)" rx="16"/><rect width="126" height="30" x="75" y="282" fill="#d9f99d" rx="15"/><text x="138" y="302" fill="#365314" class="eyebrow" text-anchor="middle">AGENT CLIENT</text><text x="75" y="350" class="server-title">Next turn</text><rect width="200" height="32" x="75" y="375" fill="#fff" stroke="#bef264" rx="8"/><text x="91" y="397" class="body">Conversation ID</text><rect width="200" height="32" x="75" y="416" fill="#fff" stroke="#bef264" rx="8"/><text x="91" y="438" class="body">Accumulated prompt</text><rect width="200" height="32" x="75" y="457" fill="#fff" stroke="#bef264" rx="8"/><text x="91" y="479" class="body">Cache salt (optional)</text><path fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)" d="M 300 375 L 376 375"/><text x="332" y="357" class="flow-label" text-anchor="middle">request</text><rect width="450" height="540" x="380" y="125" fill="#eff6ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" rx="18"/><rect width="248" height="32" x="410" y="150" fill="#dbeafe" rx="16"/><text x="534" y="171" fill="#1e3a8a" class="eyebrow" text-anchor="middle">TRTLLM-SERVE DISAGGREGATED</text><text x="410" y="220" class="server-title">Front-end orchestrator</text><rect width="390" height="34" x="410" y="242" fill="#0369a1" rx="9"/><text x="605" y="265" fill="#fff" class="eyebrow" text-anchor="middle">LEVEL 1 · INSTANCE-LEVEL ROUTING</text><text x="410" y="306" class="small">Use either routing policy to select a context server</text><rect width="390" height="112" x="410" y="326" fill="#fff" stroke="#76b900" stroke-width="2" rx="12"/><rect width="176" height="28" x="430" y="345" fill="#ecfccb" rx="14"/><text x="518" y="364" fill="#365314" class="pill" text-anchor="middle">CONVERSATION-AWARE</text><text x="430" y="397" class="card-title">Conversation ID → CTX server</text><text x="430" y="422" class="small">Least-loaded first placement, then explicit affinity</text><rect width="390" height="126" x="410" y="460" fill="#fff" stroke="#38bdf8" stroke-width="2" rx="12"/><rect width="170" height="28" x="430" y="479" fill="#e0f2fe" rx="14"/><text x="515" y="498" fill="#075985" class="pill" text-anchor="middle">KV-CACHE-AWARE</text><text x="430" y="531" class="card-title">Prompt blocks → cache view</text><text x="430" y="556" class="small">Matched blocks plus active-request load</text><text x="430" y="578" class="small">Content-derived affinity protects later turns</text><rect width="290" height="34" x="460" y="610" fill="#ecfccb" stroke="#76b900" rx="17"/><text x="605" y="633" fill="#365314" class="flow-label" text-anchor="middle">Selected destination: CTX server 1</text><rect width="640" height="650" x="890" y="110" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="18"/><rect width="198" height="32" x="920" y="132" fill="#e2e8f0" rx="16"/><text x="1019" y="153" fill="#334155" class="eyebrow" text-anchor="middle">CONTEXT (CTX) TIER</text><rect width="250" height="64" x="940" y="180" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="12"/><text x="1065" y="207" fill="#64748b" class="card-title" text-anchor="middle">CTX server 0</text><text x="1065" y="229" class="small" text-anchor="middle">other rank-local caches</text><rect width="250" height="64" x="1230" y="180" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="12"/><text x="1355" y="207" fill="#64748b" class="card-title" text-anchor="middle">CTX server 2</text><text x="1355" y="229" class="small" text-anchor="middle">other rank-local caches</text><rect width="540" height="455" x="940" y="275" fill="#fff" stroke="#76b900" stroke-width="3" filter="url(#shadow)" rx="16"/><rect width="130" height="28" x="965" y="296" fill="#d9f99d" rx="14"/><text x="1030" y="315" fill="#365314" class="pill" text-anchor="middle">SELECTED</text><text x="1115" y="317" class="card-title">CTX server 1</text><rect width="480" height="238" x="970" y="345" fill="#eff6ff" stroke="#38bdf8" stroke-width="2" rx="14"/><text x="995" y="378" class="card-title">Attention data-parallel router</text><rect width="430" height="30" x="995" y="394" fill="#0369a1" rx="8"/><text x="1210" y="415" fill="#fff" class="eyebrow" text-anchor="middle">LEVEL 2 · RANK-LEVEL ROUTING</text><text x="995" y="448" class="small">Again, use either routing policy inside the selected server</text><rect width="198" height="96" x="995" y="463" fill="#fff" stroke="#76b900" stroke-width="1.8" rx="10"/><text x="1010" y="488" fill="#365314" class="pill">CONVERSATION-AWARE</text><text x="1010" y="517" class="small">Conversation ID → rank</text><text x="1010" y="540" class="small">First turn: round-robin</text><rect width="218" height="96" x="1207" y="463" fill="#fff" stroke="#38bdf8" stroke-width="1.8" rx="10"/><text x="1222" y="488" fill="#075985" class="pill">KV-CACHE-AWARE</text><text x="1222" y="517" class="small">Rank-local prefix probe</text><text x="1222" y="540" class="small">Post-reuse work plus load</text><path fill="none" stroke="#65a30d" stroke-width="3" d="M 1210 583 L 1210 607"/><path fill="none" stroke="#65a30d" stroke-width="3" marker-end="url(#arrowGreen)" d="M 1210 607 L 1141 607 L 1141 626"/><path fill="none" stroke="#e11d48" stroke-dasharray="8 6" stroke-width="2.5" marker-end="url(#arrowRed)" d="M 1210 607 L 1394 607 L 1394 626"/><text x="1300" y="601" class="miss-label" text-anchor="middle">rank-local reuse lost</text><rect width="96" height="70" x="975" y="630" fill="#f8fafc" stroke="#cbd5e1" rx="10"/><text x="1023" y="659" fill="#64748b" class="card-title" text-anchor="middle">Rank 0</text><text x="1023" y="682" class="small" text-anchor="middle">KV cache</text><rect width="110" height="70" x="1086" y="630" fill="#f7fee7" stroke="#76b900" stroke-width="3" rx="10"/><text x="1141" y="657" class="card-title" text-anchor="middle">Rank 1</text><rect width="84" height="24" x="1099" y="667" fill="#d9f99d" rx="6"/><text x="1141" y="684" fill="#365314" class="small" text-anchor="middle">prefix KV</text><rect width="96" height="70" x="1211" y="630" fill="#f8fafc" stroke="#cbd5e1" rx="10"/><text x="1259" y="659" fill="#64748b" class="card-title" text-anchor="middle">Rank 2</text><text x="1259" y="682" class="small" text-anchor="middle">KV cache</text><rect width="96" height="70" x="1319" y="630" fill="#fff1f2" stroke="#fda4af" rx="10"/><text x="1367" y="659" fill="#64748b" class="card-title" text-anchor="middle">Rank 3</text><text x="1367" y="682" class="small" text-anchor="middle">KV cache</text><path fill="none" stroke="#65a30d" stroke-width="3.5" marker-end="url(#arrowGreen)" d="M 830 625 C 865 625, 875 350, 936 350"/><text x="856" y="530" fill="#365314" class="flow-label">same server</text><path fill="none" stroke="#e11d48" stroke-dasharray="8 6" stroke-width="2.5" marker-end="url(#arrowRed)" d="M 830 475 C 870 475, 875 212, 936 212"/><text x="842" y="340" class="miss-label">server-local</text><text x="858" y="360" class="miss-label">reuse lost</text><rect width="190" height="280" x="1570" y="300" fill="#eff6ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" rx="16"/><rect width="146" height="30" x="1592" y="322" fill="#dbeafe" rx="15"/><text x="1665" y="342" fill="#1e3a8a" class="eyebrow" text-anchor="middle">GEN SERVER</text><text x="1594" y="390" class="card-title">Generation</text><rect width="142" height="38" x="1594" y="414" fill="#fff" stroke="#bfdbfe" rx="8"/><text x="1665" y="439" class="body" text-anchor="middle">Receive KV cache</text><rect width="142" height="38" x="1594" y="465" fill="#fff" stroke="#bfdbfe" rx="8"/><text x="1665" y="490" class="body" text-anchor="middle">Continue decode</text><rect width="142" height="38" x="1594" y="516" fill="#fff" stroke="#bfdbfe" rx="8"/><text x="1665" y="541" class="body" text-anchor="middle">Stream response</text><path fill="none" stroke="#2563eb" stroke-dasharray="9 7" stroke-width="3" marker-end="url(#arrowBlue)" d="M 1141 708 L 1141 745 L 1545 745 L 1545 440 L 1566 440"/><text x="1518" y="728" fill="#1e40af" class="flow-label" text-anchor="end">CTX → GEN KV transfer</text><path fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)" d="M 1665 580 L 1665 810 L 175 810 L 175 514"/><text x="1640" y="834" class="flow-label" text-anchor="end">streamed response</text></svg>